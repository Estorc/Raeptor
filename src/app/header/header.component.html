<header>

    <div id='menu'>
        <a routerLink="/" routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }">{{ 'header.menu.home' | translate }}</a>
        <span>|</span>
        <a routerLink="/about" routerLinkActive="selected">{{ 'header.menu.about' | translate }}</a>
        <span>|</span>
        <a routerLink="/works" routerLinkActive="selected">{{ 'header.menu.works' | translate }}</a>
        <span>|</span>
        <a routerLink="/works/museum" routerLinkActive="selected">{{ 'header.menu.museum' | translate }}</a>
        <span>|</span>
        <a href="javascript:void(0)" (click)="switchLanguage()">{{ 'common.language.short' | translate }}</a>
    </div>
</header>
