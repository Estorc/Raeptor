<div class='raeptor-cards-pretty-fullcard-blurred-background' [style.backgroundImage]="'url(' + image + ')'"></div>
<div>
    <div class='raeptor-cards-pretty-fullcard-content'>
        <ng-content *ngIf="customContent"></ng-content>
        <ng-container *ngIf="!customContent">
            <img [src]="image" [alt]="imageAlt"/>
            <div class="raeptor-cards-pretty-fullcard-text">
                <h2>{{ title | translate }}</h2>
                <h3>{{ description | translate }}</h3>
                <hr class="radial-gradient">
                <div class="buttons">
                    <a mat-stroked-button [href]="link"><i class="material-symbols-outlined">play_arrow</i>{{ 'common.play' | translate }}</a>
                    <a mat-stroked-button [href]="link">{{ 'common.learn-more' | translate }}</a>
                    <a mat-stroked-button href="javascript:void(0)" (click)="copyURLToClipboard('play-button', $event.target)" class="icon-button"><i class="material-symbols-outlined">link</i></a>
                </div>
            </div>
        </ng-container>
    </div>
</div>
